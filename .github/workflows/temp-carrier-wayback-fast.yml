name: Temporary Carrier Wayback Fast Search

on:
  push:
    branches:
      - temp/carrier-wayback-fast-20260902

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Query web archives and search indexes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p results
          python - <<'PY'
          import urllib.request, urllib.parse, json, re, os, ssl
          UA='Mozilla/5.0'
          ctx=ssl.create_default_context()
          def get(url,t=30):
            req=urllib.request.Request(url,headers={'User-Agent':UA})
            try:
              with urllib.request.urlopen(req,timeout=t,context=ctx) as r: return r.read(20_000_000).decode('utf-8','replace')
            except Exception as e: return 'ERROR '+repr(e)
          out=[]
          cdx_queries=[]
          for host in ['www.transcentral.carrier.com','www.container.carrier.com','www.carrier.refrigeration.com']:
            for pat in ['*t300*','*t-300*','*matrix*','*UnitLookup*','*unitlookup*']:
              params={'url':host+'/'+pat,'output':'json','fl':'timestamp,original,statuscode,mimetype,length','filter':'statuscode:200','collapse':'urlkey','limit':'10000'}
              cdx_queries.append('https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params))
          for u in cdx_queries:
            s=get(u,25); out.append('\n===== '+u+' =====\n'+s)
          # Arquivo.pt text search
          for q in ['"Container Product Matrix" Carrier','"Carrier Transicold Container Unit Matrix"','"NT-1212" Carrier','"NT2300" Carrier Transicold','"69NT40-541-305" PID']:
            u='https://arquivo.pt/textsearch?'+urllib.parse.urlencode({'versionHistory':'','maxItems':50,'q':q})
            out.append('\n===== '+u+' =====\n'+get(u,35))
          # Bing RSS exact legacy URL/name searches
          for q in ['site:container.carrier.com matrix Carrier PID','site:transcentral.carrier.com UnitLookup','"Container Product Matrix" Carrier','"NT-2300" "69NT40"']:
            u='https://www.bing.com/search?format=rss&q='+urllib.parse.quote(q)
            out.append('\n===== '+u+' =====\n'+get(u,25))
          text='\n'.join(out)
          open('results/all_results.txt','w').write(text)
          urls=sorted(set(re.findall(r'https?://[^\s<>"\\]+',text)))
          open('results/urls.txt','w').write('\n'.join(urls))
          print('queries',len(out),'urls',len(urls))
          print('\n'.join([u for u in urls if re.search(r'(?i)t.?300|matrix|unitlookup|carrier',u)][:500]))
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: carrier-wayback-fast-results
          path: results/
          retention-days: 1

      - name: Remove temporary branch
        if: always()
        shell: bash
        run: git push origin --delete "${GITHUB_REF_NAME}" || true
